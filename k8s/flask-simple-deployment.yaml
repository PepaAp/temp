# Jednoduchý deployment - Flask aplikace samostatně s SQLite
# Port: 8000
# Pro rychlý start: kubectl apply -f flask-simple-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-simple
  namespace: default
  labels:
    app: flask-inventory
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-inventory
      tier: backend
  template:
    metadata:
      labels:
        app: flask-inventory
        tier: backend
    spec:
      containers:
      - name: flask
        image: ghcr.io/pepaap/temp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: SQLALCHEMY_DATABASE_URI
          value: "sqlite:///app.db"
        command: ["gunicorn"]
        args: ["run:app", "--bind", "0.0.0.0:8000", "--workers", "2"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-simple
  namespace: default
  labels:
    app: flask-inventory
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: flask-inventory
    tier: backend
