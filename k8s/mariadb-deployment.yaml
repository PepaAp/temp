# MariaDB deployment pro produkci
# Port: 3306 (interní)
# Perzistentní úložiště pro databázi

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: flask-app
type: Opaque
stringData:
  mysql-root-password: "changeme123"
  mysql-database: "flask"
  database-uri: "mysql+pymysql://root:changeme123@mariadb-service:3306/flask"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: flask-app
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: flask-app
  labels:
    app: inventory-system
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-system
      component: database
  template:
    metadata:
      labels:
        app: inventory-system
        component: database
    spec:
      containers:
      - name: mariadb
        image: mariadb:latest
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: mysql-root-password
        - name: MARIADB_DATABASE
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: mysql-database
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  namespace: flask-app
  labels:
    app: inventory-system
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    app: inventory-system
    component: database
