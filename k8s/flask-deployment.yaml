# Flask aplikace deployment pro produkci
# Port: 8000 (interní)
# Používá se s Nginx jako reverse proxy

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-app
  labels:
    app: inventory-system
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-system
      component: backend
  template:
    metadata:
      labels:
        app: inventory-system
        component: backend
    spec:
      containers:
      - name: flask
        image: ghcr.io/pepaap/temp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: SQLALCHEMY_DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-uri
              optional: true
        - name: SQLALCHEMY_DATABASE_URI
          value: "sqlite:///app.db"  # Fallback pokud secret neexistuje
        command: ["gunicorn"]
        args: 
        - "run:app"
        - "--bind"
        - "0.0.0.0:8000"
        - "--workers"
        - "4"
        - "--timeout"
        - "120"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: static-files
          mountPath: /app/app/static
      volumes:
      - name: static-files
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-app
  labels:
    app: inventory-system
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: inventory-system
    component: backend
